<!doctype html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1"
		/>
		<title>Генератор</title>
		<link
			rel="preconnect"
			href="https://fonts.googleapis.com"
		/>
		<link
			rel="preconnect"
			href="https://fonts.gstatic.com"
			crossorigin
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700&display=swap"
			rel="stylesheet"
		/>
		<link
			rel="stylesheet"
			href="generator.css"
		/>
		<script
			type="module"
			src="generator.js"
		></script>
	</head>
	<body>
		<div
			class="status"
			id="status"
		>
			<span class="dot"></span>
			<span id="statusText">ЗАГРУЗКА</span>
		</div>
		<button
			class="sound-toggle"
			id="soundToggle"
			type="button"
			aria-pressed="false"
			aria-label="Выключить звук"
		>
			<svg
				class="sound-icon"
				viewBox="0 0 24 24"
				aria-hidden="true"
				focusable="false"
			>
				<path d="M4 9.5h3.6L12 6v12L7.6 14.5H4z" />
				<g class="wave">
					<path d="M15.4 9.2a4.1 4.1 0 0 1 0 5.6" />
					<path d="M18.4 6.6a7.9 7.9 0 0 1 0 10.8" />
				</g>
				<g class="cross">
					<path d="M15.6 9.6l4.8 4.8" />
					<path d="M20.4 9.6l-4.8 4.8" />
				</g>
			</svg>
		</button>
		<main class="generator">
			<section
				class="words"
				aria-live="polite"
				aria-atomic="true"
			>
				<div
					class="phrase current"
					id="phrase"
				>
					<span
						class="word"
						id="word"
					></span>
					<span
						class="timer"
						id="timer"
					></span>
				</div>
				<div
					class="phrase next"
					id="nextPhrase"
				>
					<span class="next-label">следующее</span>
					<span
						class="word"
						id="nextWord"
					></span>
				</div>
			</section>
		</main>
		<footer class="footer">
			<a
				href="https://github.com/DevUnits"
				target="_blank"
			>
				Powered by DevUnits
			</a>
		</footer>
	</body>
</html>
